name: Validate public Core

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/mcp/webex/package-lock.json

      - name: Validate public Core boundary
        run: node scripts/validate-core.mjs

      - name: Install Webex MCP dependencies
        run: npm --prefix tools/mcp/webex ci --ignore-scripts

      - name: Build Webex MCP server
        run: npm --prefix tools/mcp/webex run build

      - name: Audit production dependencies
        run: npm --prefix tools/mcp/webex audit --omit=dev --audit-level=high
